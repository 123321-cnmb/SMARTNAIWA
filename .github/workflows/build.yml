name: Build desktop apps

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            artifact: macos
          - platform: windows-latest
            artifact: windows
            # Windows 只出 NSIS。
            #
            # tauri.conf.json 里 bundle.targets 是 "all"，Windows 上会连 MSI 一起打，
            # 而 MSI 必挂：WiX 的 light.exe 处理不了非 ASCII 的产品名，
            # 输出文件叫「奶蛙_0.1.0_x64_en-US.msi」，light.exe 直接报
            # `failed to run ...\WixTools314\light.exe`（本机和 CI 一样炸）。
            #
            # 这个项目从头到尾也只发过 NSIS（scripts/build-windows.ps1 一直传
            # --bundles nsis），所以直接不要 MSI。
            args: --bundles nsis

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        with:
          args: ${{ matrix.args }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: naiwa-pet-${{ matrix.artifact }}
          path: |
            src-tauri/target/release/bundle/**/*
