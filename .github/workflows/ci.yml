name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: 检查
    # 钉在 24.04：ubuntu-latest 正在往 Ubuntu 26 迁，而 Tauri v2 的 wry
    # 依赖 webkit2gtk-4.1，新发行版的包名/版本可能对不上。
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # Tauri 在 Linux 上要 webkit2gtk / gtk / appindicator 这些系统库，
      # GitHub 的 runner 镜像默认只带运行库、不带 -dev 包，
      # 不装的话 cargo check 会在 pkg-config 那步直接失败。
      - name: 安装 Linux 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: TypeScript 检查 + 前端构建
        run: npm run build

      - name: Rust 格式检查
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Rust 编译检查
        run: cargo check --manifest-path src-tauri/Cargo.toml

  check-windows:
    name: Windows 编译检查
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 构建前端
        run: npm run build

      - name: Rust 编译检查
        run: cargo check --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-msvc
